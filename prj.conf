CONFIG_GPIO=y

CONFIG_TRUSTED_EXECUTION_NONSECURE=y

#CONFIG_NO_OPTIMIZATIONS=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y

# UART logging devzone.nordicsemi.com/.../nrf91-zephyr-enable-lte-logging
CONFIG_LOG=y
#CONFIG_SERIAL=y
#CONFIG_STDOUT_CONSOLE=y
#CONFIG_UART_INTERRUPT_DRIVEN=y
# or disable it
# CONFIG_SERIAL=y
CONFIG_STDOUT_CONSOLE=y

#docs.zephyrproject.org/.../nordic_segger.html
CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=y
#CONFIG_HAS_SEGGER_RTT=y
CONFIG_USE_SEGGER_RTT=y

#CONFIG_LOG_BACKEND_RTT=y
#CONFIG_SHELL_BACKEND_RTT=y
#CONFIG_LOG_BACKEND_RTT_FORCE_PRINTK=y

# ##I2C
CONFIG_I2C=y
CONFIG_I2C_NRFX=y

##FILE SYSTEM SD CARD
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y

CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y
CONFIG_SPI=y
CONFIG_SDMMC_OVER_SPI=y
CONFIG_SPI_NRFX_RAM_BUFFER_SIZE=8

##memory
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

##LTE MODEM
CONFIG_NRF_MODEM_LIB=y
CONFIG_NRF_MODEM_LIB_SYS_INIT=y
CONFIG_AT_MONITOR=y

CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y

CONFIG_FTP_CLIENT=y
CONFIG_FTP_CLIENT_KEEPALIVE_TIME=60
CONFIG_FTP_CLIENT_LISTEN_TIME=10


CONFIG_NEWLIB_LIBC=y


